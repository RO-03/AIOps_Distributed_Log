# spark-defaults.conf — AIOps Platform
# MinIO endpoint: minio-oss (storage-net hostname)
# Lakehouse bucket: telemetry-lakehouse (per spec Step 1.3)

spark.hadoop.fs.s3a.endpoint                    http://minio-oss:9000
spark.hadoop.fs.s3a.access.key                  aiops_admin
spark.hadoop.fs.s3a.secret.key                  aiops_secret_2024
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled      false
spark.hadoop.fs.s3a.fast.upload                 true

# Delta Lake
spark.sql.extensions                            io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                 org.apache.spark.sql.delta.catalog.DeltaCatalog

# Performance
spark.sql.shuffle.partitions                    8
spark.default.parallelism                       8
spark.serializer                                org.apache.spark.serializer.KryoSerializer

# Kafka Structured Streaming broker addresses (storage-net / serving-net)
spark.kafka.bootstrap.servers                   kafka-1:29092,kafka-2:29092,kafka-3:29092