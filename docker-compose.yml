# docker-compose.yml
# AIOps Distributed Log Diagnostics & Failure Prediction Platform
# Phase 1 — Multi-network Docker Compose (3 isolated bridge networks)
#
# Networks:
#   ingestion-net  → log-generator, fluentd-agent, kafka-1..3
#   storage-net    → kafka-1..3, spark-master, spark-worker, minio-oss, postgres-db
#   serving-net    → kafka-1..3, fastapi-server, grafana-dashboard

networks:
  ingestion-net:
    driver: bridge
    name: aiops-ingestion-net
  storage-net:
    driver: bridge
    name: aiops-storage-net
  serving-net:
    driver: bridge
    name: aiops-serving-net

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  minio_data:
  postgres_data:
  grafana_data:
  fluentd_buffer:
  log_shared:

services:

  # ── Kafka KRaft Cluster (3 brokers, NO ZooKeeper) ─────────────────────────────
  # Each broker acts as both controller and broker (combined mode)

  kafka-1:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-1
    hostname: kafka-1
    networks:
      - ingestion-net
      - storage-net
      - serving-net
    ports:
      - "9092:9092"
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      CLUSTER_ID: "LelM2dIFQkiUFvXCEcqRWA"
      # Listeners
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka-1:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Replication & reliability
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Retention
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_MESSAGE_MAX_BYTES: 2097152
      KAFKA_REPLICA_FETCH_MAX_BYTES: 2097152
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-1:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  kafka-2:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-2
    hostname: kafka-2
    networks:
      - ingestion-net
      - storage-net
      - serving-net
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      CLUSTER_ID: "LelM2dIFQkiUFvXCEcqRWA"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9094,INTERNAL://kafka-2:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_MESSAGE_MAX_BYTES: 2097152
      KAFKA_REPLICA_FETCH_MAX_BYTES: 2097152
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-2:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  kafka-3:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-3
    hostname: kafka-3
    networks:
      - ingestion-net
      - storage-net
      - serving-net
    ports:
      - "9096:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      CLUSTER_ID: "LelM2dIFQkiUFvXCEcqRWA"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9096,INTERNAL://kafka-3:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_MESSAGE_MAX_BYTES: 2097152
      KAFKA_REPLICA_FETCH_MAX_BYTES: 2097152
    volumes:
      - kafka3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-3:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ── Kafka Topic Initializer (runs once after all brokers healthy) ─────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    networks:
      - ingestion-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for Kafka cluster...' &&
        sleep 5 &&
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic system-logs --partitions 3 --replication-factor 3 --config retention.ms=86400000 &&
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic critical-alerts --partitions 1 --replication-factor 3 --config retention.ms=604800000 &&
        echo 'Topics created:' &&
        kafka-topics --bootstrap-server kafka-1:29092 --list
      "
    restart: on-failure

  # ── Log Generator (Phase 0 / Phase 2) ────────────────────────────────────────
  # Replays BGL/synthetic logs by appending to a shared volume file
  log-generator:
    build:
      context: .
      dockerfile: docker/log-generator/Dockerfile
    container_name: log-generator
    hostname: log-generator
    networks:
      - ingestion-net
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - log_shared:/var/log/aiops
    environment:
      LOG_FILE: /var/log/aiops/system.log
      DATASET_FILE: /data/raw/BGL_2k.log
      SLEEP_INTERVAL: "0.001"
    restart: unless-stopped

  # ── Fluentd Aggregator (Phase 2) ─────────────────────────────────────────────
  fluentd-agent:
    build:
      context: .
      dockerfile: docker/fluentd/Dockerfile
    container_name: fluentd-agent
    hostname: fluentd-agent
    user: root
    networks:
      - ingestion-net
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - log_shared:/var/log/aiops:ro
      - ./config/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - fluentd_buffer:/fluentd/buffer
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    restart: unless-stopped

  # ── MinIO Object Storage (Storage Layer) ─────────────────────────────────────
  minio-oss:
    image: minio/minio:latest
    container_name: minio-oss
    hostname: minio-oss
    networks:
      - storage-net
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: aiops_admin
      MINIO_ROOT_PASSWORD: aiops_secret_2024
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── MinIO Bucket Init ─────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    networks:
      - storage-net
    depends_on:
      minio-oss:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio-oss:9000 aiops_admin aiops_secret_2024 &&
        mc mb --ignore-existing local/telemetry-lakehouse &&
        mc mb --ignore-existing local/aiops-checkpoints &&
        mc mb --ignore-existing local/aiops-models &&
        echo 'MinIO buckets initialized: telemetry-lakehouse, aiops-checkpoints, aiops-models'
      "
    restart: on-failure

  # ── PostgreSQL Analytical Database (Storage Layer) ───────────────────────────
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    hostname: postgres-db
    networks:
      - storage-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aiops_analytics
      POSTGRES_USER: aiops_user
      POSTGRES_PASSWORD: aiops_pg_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops_user -d aiops_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Spark Master (Storage Layer) ──────────────────────────────────────────────
  spark-master:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master
    networks:
      - storage-net
    ports:
      - "8081:8080"
      - "7077:7077"
    environment:
      SPARK_NO_DAEMONIZE: "true"
      AWS_ACCESS_KEY_ID: aiops_admin
      AWS_SECRET_ACCESS_KEY: aiops_secret_2024
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Spark Worker (Storage Layer) ──────────────────────────────────────────────
  spark-worker:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: spark-worker
    hostname: spark-worker
    networks:
      - storage-net
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8082:8081"
    environment:
      SPARK_NO_DAEMONIZE: "true"
      AWS_ACCESS_KEY_ID: aiops_admin
      AWS_SECRET_ACCESS_KEY: aiops_secret_2024
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  # ── FastAPI Async Gateway (Serving Layer) ─────────────────────────────────────
  fastapi-server:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    container_name: fastapi-server
    hostname: fastapi-server
    networks:
      - serving-net
      - storage-net
    depends_on:
      kafka-1:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
      KAFKA_ALERT_TOPIC: "critical-alerts"
      POSTGRES_DSN: "postgresql://aiops_user:aiops_pg_2024@postgres-db:5432/aiops_analytics"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Grafana Dashboard (Serving Layer) ─────────────────────────────────────────
  grafana-dashboard:
    image: grafana/grafana:10.2.0
    container_name: grafana-dashboard
    hostname: grafana-dashboard
    networks:
      - serving-net
      - storage-net
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: aiops_grafana
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
