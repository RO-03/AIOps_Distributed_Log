version: "3.9"

# =============================================================================
# docker-compose.yml — Phase 1: AIOps Infrastructure Stack
#
# Services:
#   zookeeper       Apache ZooKeeper (Kafka coordination)
#   kafka           Apache Kafka (event streaming)
#   kafka-ui        Kafka management UI
#   minio           S3-compatible object store (Delta Lake backend)
#   minio-init      One-shot bucket initializer
#   spark-master    Apache Spark master node
#   spark-worker-1  Spark worker node 1
#   spark-worker-2  Spark worker node 2
#   delta-init      Creates Delta Lake schema on MinIO
#   prometheus      Metrics scraping
#   grafana         Dashboards
# =============================================================================

networks:
  aiops-net:
    driver: bridge

volumes:
  minio_data:
  prometheus_data:
  grafana_data:
  kafka_data:
  zookeeper_data:

services:

  # ── ZooKeeper ───────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aiops-zookeeper
    networks: [aiops-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aiops-kafka
    networks: [aiops-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"        # External access
      - "9101:9101"        # JMX metrics
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ── Kafka UI ─────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: aiops-kafka-ui
    networks: [aiops-net]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aiops-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # ── MinIO (S3-compatible Delta Lake storage) ──────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-01T00-00-00Z
    container_name: aiops-minio
    networks: [aiops-net]
    ports:
      - "9000:9000"        # API
      - "9001:9001"        # Console UI
    environment:
      MINIO_ROOT_USER: aiops_admin
      MINIO_ROOT_PASSWORD: aiops_secret_2024
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Bucket Initializer (one-shot) ───────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: aiops-minio-init
    networks: [aiops-net]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 aiops_admin aiops_secret_2024 &&
        mc mb --ignore-existing local/aiops-lakehouse &&
        mc mb --ignore-existing local/aiops-checkpoints &&
        mc mb --ignore-existing local/aiops-models &&
        mc anonymous set download local/aiops-lakehouse &&
        echo 'Buckets initialized successfully'
      "
    restart: on-failure

  # ── Spark Master ──────────────────────────────────────────────────────────────
  spark-master:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: aiops-spark-master
    networks: [aiops-net]
    ports:
      - "8081:8080"        # Spark Web UI
      - "7077:7077"        # Spark master port
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      AWS_ACCESS_KEY_ID: aiops_admin
      AWS_SECRET_ACCESS_KEY: aiops_secret_2024
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Spark Worker 1 ────────────────────────────────────────────────────────────
  spark-worker-1:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: aiops-spark-worker-1
    networks: [aiops-net]
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8082:8081"
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 8081
      AWS_ACCESS_KEY_ID: aiops_admin
      AWS_SECRET_ACCESS_KEY: aiops_secret_2024

  # ── Spark Worker 2 ────────────────────────────────────────────────────────────
  spark-worker-2:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    container_name: aiops-spark-worker-2
    networks: [aiops-net]
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8083:8081"
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 8081
      AWS_ACCESS_KEY_ID: aiops_admin
      AWS_SECRET_ACCESS_KEY: aiops_secret_2024

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: aiops-prometheus
    networks: [aiops-net]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: aiops-grafana
    networks: [aiops-net]
    depends_on: [prometheus]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: aiops_grafana
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
