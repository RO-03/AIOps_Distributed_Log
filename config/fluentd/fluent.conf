# config/fluentd/fluent.conf
# Phase 2 / Step 2.3 — Fluentd Parsing Pipeline
#
# Pipeline:
#   Tail live log file → Parse raw logs → Buffer on disk → Forward to Kafka
#
# Requirements met:
#   ✅ Tail live file (tail input plugin)
#   ✅ Parse raw BGL supercomputer logs (regex parser)
#   ✅ Persistent chunk storage on disk (buffer)
#   ✅ Memory protection (chunk_limit_size, queue_limit_length)
#   ✅ Automatic retry behavior (retry_max_interval, retry_forever)

# ── System settings ───────────────────────────────────────────────────────────
<system>
  log_level info
  workers 1
</system>

# ── Input: Tail the shared log file written by log-generator ─────────────────
<source>
  @type tail
  @id input_system_log
  path /var/log/aiops/system.log
  pos_file /fluentd/buffer/system.log.pos
  tag aiops.raw

  # BGL Supercomputer log format:
  # - col 0: alert code (- = normal, code = failure)
  # - col 1..3: timestamp fields
  # - col 4: node
  # - col 5: date
  # - col 6: time
  # - col 7: node (repeat)
  # - col 8: component
  # - col 9: level
  # - col 10+: message
  #
  # Example line:
  # - 1117838570 2005.06.03 R02-M1-N0-C:J12-U11 2005-06-03-15.42.50.675872 R02-M1-N0-C:J12-U11 RAS KERNEL INFO instruction cache parity error corrected
  <parse>
    @type regexp
    expression /^(?<alert_code>[^\s]+)\s+(?<epoch>\d+)\s+(?<date_str>[^\s]+)\s+(?<node_id>[^\s]+)\s+(?<timestamp>[^\s]+)\s+(?<node_repeat>[^\s]+)\s+(?<component>[^\s]+)\s+(?<severity>[^\s]+)\s+(?<message>.+)$/
    time_key timestamp
    time_format %Y-%m-%d-%H.%M.%S.%N
    keep_time_key true
    types epoch:integer
  </parse>

  # Read from beginning for replay; change to tail for production
  read_from_head true
  # Emit incomplete lines every 1s to handle partial writes
  multiline_flush_interval 1s
</source>

# ── Filter: Enrich records with derived fields ────────────────────────────────
<filter aiops.raw>
  @type record_transformer
  enable_ruby true
  <record>
    # Mark as anomaly if alert_code is not "-"
    is_anomaly ${record["alert_code"] != "-" ? 1 : 0}
    # Normalized severity
    severity   ${(record["severity"] || "UNKNOWN").upcase}
    # Fluentd ingestion timestamp
    ingested_at ${Time.now.utc.strftime("%Y-%m-%dT%H:%M:%S.%LZ")}
    # Source tag
    source     "fluentd-agent"
  </record>
  # Remove redundant fields
  remove_keys node_repeat
</filter>

# ── Output: Forward to Kafka with disk buffering ──────────────────────────────
<match aiops.raw>
  @type kafka2
  @id output_kafka

  # Kafka cluster (3-broker KRaft cluster — internal listener)
  brokers kafka-1:29092,kafka-2:29092,kafka-3:29092

  # Target topic (Step 2.4 — system-logs, 3 partitions, RF=3)
  default_topic system-logs

  # Producer reliability: acks=all (Step 2.4 requirement)
  required_acks -1

  # Message format
  <format>
    @type json
  </format>

  # ── Disk Buffer (Step 2.3 requirements) ──────────────────────────────────────
  <buffer>
    @type file
    path /fluentd/buffer/kafka_output

    # Memory protection — max chunk size 8 MB, queue up to 128 chunks (1 GB total)
    chunk_limit_size 8m
    queue_limit_length 128
    total_limit_size 1g

    # Flush behavior — balance latency vs throughput
    flush_mode interval
    flush_interval 1s
    flush_thread_count 2

    # Retry behavior — exponential backoff, retry forever to prevent log loss
    retry_type exponential_backoff
    retry_wait 1s
    retry_max_interval 30s
    retry_forever true

    # Overflow handling — block (do NOT drop data)
    overflow_action block
  </buffer>

  # Producer settings for reliability
  max_send_retries 3
  kafka_agg_max_bytes 1048576
</match>

# ── Dead letter: capture parse failures ──────────────────────────────────────
<label @FLUENT_LOG>
  <match fluent.*>
    @type stdout
  </match>
</label>
